# PARKED (not active): the live site deploys straight from the main branch (Pages source "Deploy from a branch",
# root folder, .nojekyll). To use this Actions workflow instead (publishes only index.html, js/, assets/):
#   gh auth refresh -h github.com -s workflow          # the token needs the "workflow" scope to push workflow files
#   mkdir -p .github/workflows && git mv src/tools/deploy-pages.yml .github/workflows/ && git commit -m "Deploy with Actions" && git push
#   gh api -X PUT repos/OWNER/REPO/pages -f build_type=workflow
#
# Publishes the static site (index.html, js/, assets/) to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions"
# (or: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect the site files (sources, docs and tooling are not published)
        run: |
          set -euo pipefail
          mkdir _site
          cp -R index.html js assets _site/
          for f in index.html js/three.min.js js/ghg3-engine.min.js js/content.js js/dc-lite.js js/app.js \
                   assets/owl.webp assets/sapling.webp assets/firefly.webp; do
            test -s "_site/$f" || { echo "::error::missing site file $f"; exit 1; }
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
